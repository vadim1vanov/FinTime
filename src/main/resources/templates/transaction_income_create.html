<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание доходной транзакции</title>
</head>
<body>
<h1>Создать доходную транзакцию</h1>

<form action="/transaction/create/income" method="post">
    <label>ID аккаунта:
        <input type="number" name="accountId" required min="1" step="1">
    </label><br>

    <label>
        Сумма:
        <input type="number" name="amount" step="0.01" required>
    </label><br>

    <label>
        Описание:
        <input type="text" name="description">
    </label><br>

    <button type="submit">Создать транзакцию</button>
</form>


</body>
</html>
