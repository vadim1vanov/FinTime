<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание расходной транзакции</title>
</head>
<body>
<h1>Создать расходную транзакцию</h1>

<form action="/transaction/create/expense" method="post">
    <label>ID аккаунта:
        <input type="number" name="accountId" required min="1" step="1">
    </label><br>

    <label>
        Сумма расхода:
        <input type="number" name="amount" step="0.01" required min="0.01">
    </label><br>

    <label>
        Описание расхода:
        <input type="text" name="description" placeholder="Например: Еда, Транспорт">
    </label><br>

    <button type="submit">Создать расход</button>
</form>

<a href="/accounts">← Назад к счетам</a>
</body>
</html>
